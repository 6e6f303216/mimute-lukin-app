<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#181825" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lukin</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    :root {
      --ctp-base: #1e1e2e;
      --ctp-mantle: #181825;
      --ctp-crust: #11111b;
      --ctp-surface0: #313244;
      --ctp-surface1: #45475a;
      --ctp-surface2: #585b70;
      --ctp-text: #cdd6f4;
      --ctp-subtext1: #bac2de;
      --ctp-subtext0: #a6adc8;
      --ctp-overlay0: #6c7086;
      --ctp-mauve: #cba6f7;
      --ctp-blue: #89b4fa;
      --ctp-lavender: #b4befe;
      --ctp-green: #a6e3a1;
      --ctp-yellow: #f9e2af;
      --ctp-red: #f38ba8;

      --glass-bg: rgba(24, 24, 37, 0.78);
      --glass-surface: rgba(49, 50, 68, 0.44);
      --glass-border: rgba(205, 214, 244, 0.09);
      --glass-border-accent: rgba(203, 166, 247, 0.28);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.05);

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--ctp-crust);
      color: var(--ctp-text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 14% 8%, rgba(203, 166, 247, 0.09), transparent 44%),
        radial-gradient(circle at 88% 92%, rgba(137, 180, 250, 0.08), transparent 46%),
        var(--ctp-base);
      z-index: 0;
    }

    /* Чистый чёрный фон корневых элементов в полноэкранном режиме (убирает серые полосы под чёлкой/вырезом камеры) */
    html.fs-active,
    html.fs-active body,
    html:fullscreen,
    html:fullscreen body,
    html:-webkit-full-screen,
    html:-webkit-full-screen body {
      background: #000000 !important;
      background-color: #000000 !important;
    }

    html.fs-active body::before,
    html:fullscreen body::before,
    html:-webkit-full-screen body::before {
      display: none !important;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding-top: var(--safe-top);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    /* Верхняя панель без лишней иконки бренда */
    .topbar {
      flex-shrink: 0;
      height: 50px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--glass-highlight);
    }

    .p2p-pill {
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      color: var(--ctp-subtext1);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .p2p-pill:active { transform: scale(0.96); }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ctp-yellow);
      box-shadow: 0 0 8px rgba(249, 226, 175, 0.65);
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
    }

    .p2p-pill.connected { border-color: rgba(166, 227, 161, 0.28); }
    .p2p-pill.connected .status-dot {
      background: var(--ctp-green);
      box-shadow: 0 0 10px rgba(166, 227, 161, 0.75);
    }
    .p2p-pill.connecting .status-dot { animation: pulseDot 1.4s infinite ease-in-out; }

    .p2p-slot {
      padding: 1px 6px;
      border-radius: 6px;
      background: rgba(203, 166, 247, 0.14);
      color: var(--ctp-mauve);
      font-size: 11px;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.45; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .library-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border-accent);
      background: linear-gradient(135deg, rgba(203, 166, 247, 0.2), rgba(137, 180, 250, 0.18));
      color: var(--ctp-text);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .library-btn svg { color: var(--ctp-mauve); }
    .library-btn:active { transform: scale(0.96); }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass-surface);
      color: var(--ctp-text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.94);
      border-color: var(--glass-border-accent);
    }

    /* Контейнер видеоплеера */
    .player-wrapper {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 38dvh;
      background: #000000;
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Полноэкранный режим на весь физический экран (edge-to-edge, включая вырез камеры) */
    html.fs-active .player-wrapper,
    html:fullscreen .player-wrapper,
    html:-webkit-full-screen .player-wrapper,
    .player-wrapper:fullscreen,
    .player-wrapper:-webkit-full-screen,
    .player-wrapper.is-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      aspect-ratio: auto !important;
      border: none !important;
      box-shadow: none !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000000 !important;
      z-index: 99999 !important;
    }

    .player-wrapper::backdrop {
      background: #000000;
    }

    video#videoPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000000;
      transition: object-fit 0.2s ease;
    }

    video#videoPlayer.fill-crop {
      object-fit: cover;
    }

    /* Полноэкранный режим на весь физический экран (edge-to-edge, включая вырез камеры) */
    html.fs-active .player-wrapper,
    html:fullscreen .player-wrapper,
    html:-webkit-full-screen .player-wrapper,
    .player-wrapper:fullscreen,
    .player-wrapper:-webkit-full-screen,
    .player-wrapper.is-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      aspect-ratio: auto !important;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000000 !important;
      z-index: 99999 !important;
    }

    .player-wrapper::backdrop {
      background: #000000;
    }

    video#videoPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000000;
    }

    .player-empty {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: radial-gradient(circle at center, rgba(30, 30, 46, 0.88), rgba(17, 17, 27, 0.97));
      cursor: pointer;
    }

    .player-empty.hidden { display: none; }

    .player-empty-ring {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(203, 166, 247, 0.12);
      border: 1px solid var(--glass-border-accent);
      color: var(--ctp-mauve);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .player-empty-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--ctp-subtext0);
    }

    .unmute-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 18;
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(24, 24, 37, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border-accent);
      color: var(--ctp-mauve);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    html.fs-active .unmute-badge,
    html:fullscreen .unmute-badge,
    html:-webkit-full-screen .unmute-badge,
    .player-wrapper.is-fullscreen .unmute-badge {
      top: max(14px, var(--safe-top));
      right: max(16px, var(--safe-right));
    }

    .unmute-badge.visible { display: inline-flex; }

    /* Индикатор двойного тапа для перемотки */
    .seek-ripple {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 14;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(24, 24, 37, 0.74);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border-accent);
      color: var(--ctp-text);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .seek-ripple.left { left: 14%; }
    .seek-ripple.right { right: 14%; }
    .seek-ripple.show { opacity: 1; }

    .player-controls {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 12px;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.74) 0%,
        rgba(0, 0, 0, 0.08) 38%,
        rgba(0, 0, 0, 0.08) 62%,
        rgba(0, 0, 0, 0.84) 100%
      );
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    /* Безопасные отступы только для элементов управления в полноэкранном режиме */
    html.fs-active .player-controls,
    html:fullscreen .player-controls,
    html:-webkit-full-screen .player-controls,
    .player-wrapper:fullscreen .player-controls,
    .player-wrapper:-webkit-full-screen .player-controls,
    .player-wrapper.is-fullscreen .player-controls {
      padding-top: max(14px, var(--safe-top));
      padding-bottom: max(16px, var(--safe-bottom));
      padding-left: max(18px, var(--safe-left));
      padding-right: max(18px, var(--safe-right));
    }

    .player-controls.hidden-ui {
      opacity: 0;
      pointer-events: none;
    }

    .controls-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .video-title-chip {
      max-width: 78%;
      padding: 5px 11px;
      border-radius: 9px;
      background: rgba(24, 24, 37, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 500;
      color: var(--ctp-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .ctrl-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(24, 24, 37, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--ctp-text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .ctrl-circle:active { transform: scale(0.92); }

    .ctrl-circle.play-main {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, rgba(203, 166, 247, 0.36), rgba(137, 180, 250, 0.32));
      border-color: var(--glass-border-accent);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .controls-bottom {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .scrubber-wrap {
      position: relative;
      width: 100%;
      height: 26px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }

    .scrubber-track {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(205, 214, 244, 0.22);
      overflow: visible;
      transition: height 0.15s ease;
    }

    .scrubber-wrap:active .scrubber-track,
    .scrubber-wrap.scrubbing .scrubber-track {
      height: 6px;
    }

    .scrubber-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ctp-mauve), var(--ctp-blue));
    }

    .scrubber-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 2.5px solid var(--ctp-mauve);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(203, 166, 247, 0.8);
      transition: transform 0.15s ease;
    }

    .scrubber-wrap:active .scrubber-thumb,
    .scrubber-wrap.scrubbing .scrubber-thumb {
      transform: translate(-50%, -50%) scale(1.25);
    }

    .controls-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--ctp-subtext1);
    }

    .controls-right-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-ctrl-btn {
      height: 32px;
      min-width: 32px;
      padding: 0 8px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(24, 24, 37, 0.66);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--ctp-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.18s ease, background-color 0.18s ease, transform 0.12s ease;
    }

    .mini-ctrl-btn:active {
      transform: scale(0.94);
      border-color: var(--glass-border-accent);
    }

    .mini-ctrl-btn.active-mode {
      border-color: var(--glass-border-accent);
      background: rgba(203, 166, 247, 0.22);
      color: var(--ctp-mauve);
    }

    .aspect-toggle-btn {
      display: none;
    }

    html.fs-active .aspect-toggle-btn,
    .player-wrapper:fullscreen .aspect-toggle-btn,
    .player-wrapper:-webkit-full-screen .aspect-toggle-btn,
    .player-wrapper.is-fullscreen .aspect-toggle-btn {
      display: inline-flex;
    }

    .scrubber-track {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(205, 214, 244, 0.24);
      overflow: visible;
    }

    .scrubber-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ctp-mauve), var(--ctp-blue));
    }

    .scrubber-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ctp-text);
      border: 2px solid var(--ctp-mauve);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(203, 166, 247, 0.7);
    }

    .controls-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      color: var(--ctp-subtext1);
    }

    .controls-right-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-ctrl-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(24, 24, 37, 0.62);
      color: var(--ctp-text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .mini-ctrl-btn:active { border-color: var(--glass-border-accent); }

    /* Чат */
    .chat-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(30, 30, 46, 0.65);
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(108, 112, 134, 0.35);
      border-radius: 999px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: msgIn 0.2s ease-out;
    }

    .msg-row.self { align-self: flex-end; align-items: flex-end; }
    .msg-row.peer { align-self: flex-start; align-items: flex-start; }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.42;
      word-break: break-word;
      user-select: text;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--glass-highlight);
    }

    .msg-row.self .msg-bubble {
      background: linear-gradient(135deg, rgba(203, 166, 247, 0.22), rgba(137, 180, 250, 0.2));
      border: 1px solid rgba(203, 166, 247, 0.28);
      border-bottom-right-radius: 5px;
      color: var(--ctp-text);
    }

    .msg-row.peer .msg-bubble {
      background: rgba(24, 24, 37, 0.78);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 5px;
      color: var(--ctp-text);
    }

    .msg-time {
      margin-top: 3px;
      padding: 0 4px;
      font-size: 10px;
      color: var(--ctp-overlay0);
      font-variant-numeric: tabular-nums;
    }

    .sys-pill {
      align-self: center;
      max-width: 92%;
      padding: 4px 11px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(24, 24, 37, 0.64);
      border: 1px solid var(--glass-border);
      color: var(--ctp-subtext0);
      font-size: 11.5px;
      animation: msgIn 0.2s ease-out;
    }

    .sys-pill svg { color: var(--ctp-blue); flex-shrink: 0; }
    .sys-pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chat-input-bar {
      flex-shrink: 0;
      padding: 8px 12px calc(10px + var(--safe-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
    }

    .chat-input {
      flex: 1;
      height: 42px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(49, 50, 68, 0.45);
      color: var(--ctp-text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .chat-input::placeholder { color: var(--ctp-overlay0); }
    .chat-input:focus {
      border-color: var(--glass-border-accent);
      background: rgba(49, 50, 68, 0.65);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 14px;

          const saved = window.localStorage.getItem(STORAGE_KEY_SERVER);
          if (saved && saved.trim()) {
            return normalizeServerUrl(saved.trim());
          }
        } catch (e) {}
        return PRESET_SERVERS[1];
      }

      function saveServerUrl(url) {
        try {
          window.localStorage.setItem(STORAGE_KEY_SERVER, url);
        } catch (e) {}
      }

      function normalizeServerUrl(raw) {
        let cleaned = raw.trim();
        if (!cleaned) return PRESET_SERVERS[1];
        if (!/^https?:\/\//i.test(cleaned)) {
          cleaned = "http://" + cleaned;
        }
        return cleaned.replace(/\/+$/, "");
      }

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return "00:00";
        const total = Math.floor(seconds);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        const mm = String(m).padStart(2, "0");
        const ss = String(s).padStart(2, "0");
        return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
      }

      function getNowTimeStr() {
        const now = new Date();
        return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      }

      function isVideoFileName(pathname) {
        const clean = pathname.split("?")[0].split("#")[0].toLowerCase();
        return VIDEO_EXTENSIONS.some((ext) => clean.endsWith(ext));
      }

      function getExtensionLabel(pathname) {
        const clean = pathname.split("?")[0].split("#")[0];
        const dotIdx = clean.lastIndexOf(".");
        return dotIdx !== -1 ? clean.slice(dotIdx + 1).toUpperCase() : "VIDEO";
      }

      const SVG_ICONS = {
        play: `<polygon points="6 4 20 12 6 20 6 4"></polygon>`,
        pause: `<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>`,
        volumeOn: `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>`,
        volumeMuted: `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`,
        fsEnter: `<polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line>`,
        fsExit: `<polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line>`,
        film: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line></svg>`,
        sysPlay: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>`,
        sysPause: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>`,
        sysSeek: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline></svg>`,
        sysLink: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>`,
        folder: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`,
        fileVideo: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><polygon points="10 12 16 15 10 18 10 12"></polygon></svg>`
      };

      function appendChatMessage(text, isSelf) {
        const row = document.createElement("div");
        row.className = `msg-row ${isSelf ? "self" : "peer"}`;

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        bubble.textContent = text;

        const time = document.createElement("span");
        time.className = "msg-time";
        time.textContent = getNowTimeStr();

        row.appendChild(bubble);
        row.appendChild(time);
        els.chatMessages.appendChild(row);
        scrollChatToBottom();
      }

      function appendSystemNotice(iconHtml, text) {
        const pill = document.createElement("div");
        pill.className = "sys-pill";
        pill.innerHTML = iconHtml;

        const label = document.createElement("span");
        label.textContent = text;
        pill.appendChild(label);

        els.chatMessages.appendChild(pill);
        scrollChatToBottom();
      }

      function scrollChatToBottom() {
        requestAnimationFrame(() => {
          els.chatMessages.scrollTop = els.chatMessages.scrollHeight;
        });
      }

      function updateP2PIndicator() {
        const slot = state.myPeerId === PEER_ID_PRIMARY
          ? "1"
          : state.myPeerId === PEER_ID_SECONDARY
            ? "2"
            : "-";

        els.p2pSlotBadge.textContent = slot;

        if (state.isConnected) {
          els.p2pStatusPill.classList.remove("connecting");
          els.p2pStatusPill.classList.add("connected");
          els.p2pStatusText.textContent = "Онлайн";
        } else {
          els.p2pStatusPill.classList.remove("connected");
          els.p2pStatusPill.classList.add("connecting");
          els.p2pStatusText.textContent = "Поиск";
        }
      }

      function clearP2PTimers() {
        clearTimeout(state.reconnectTimer);
        clearTimeout(state.connectTimeoutTimer);
        clearInterval(state.heartbeatTimer);
      }

      function initP2P(preferredId = PEER_ID_PRIMARY) {
        clearP2PTimers();

        if (state.conn) {
          try { state.conn.close(); } catch (e) {}
          state.conn = null;
        }
        if (state.peer) {
          try { state.peer.destroy(); } catch (e) {}
          state.peer = null;
        }

        state.isConnected = false;
        state.myPeerId = null;
        updateP2PIndicator();

        if (typeof Peer === "undefined") {
          state.reconnectTimer = setTimeout(() => initP2P(PEER_ID_PRIMARY), 2500);
          return;
        }

        const peer = new Peer(preferredId, {
          ...PEER_SERVER_CONFIG,
          debug: 0,
          config: {
            iceServers: ICE_SERVERS,
            iceCandidatePoolSize: 4
          }
        });

        state.peer = peer;

        peer.on("open", (assignedId) => {
          if (state.peer !== peer) return;
          state.myPeerId = assignedId;
          updateP2PIndicator();

          if (assignedId === PEER_ID_SECONDARY) {
            connectToPrimaryPeer();
          }
        });

        peer.on("connection", (incomingConn) => {
          if (state.peer !== peer) return;
          bindDataChannel(incomingConn);
        });

        peer.on("disconnected", () => {
          if (state.peer !== peer) return;
          state.reconnectTimer = setTimeout(() => {
            if (state.peer === peer && !peer.destroyed) {
              try {
                peer.reconnect();
              } catch (e) {
                initP2P(PEER_ID_PRIMARY);
              }
            }
          }, 1500);
        });

        peer.on("error", (err) => {
          if (state.peer !== peer) return;
          const errType = err && err.type ? err.type : "";

          if (errType === "unavailable-id" && preferredId === PEER_ID_PRIMARY) {
            initP2P(PEER_ID_SECONDARY);
            return;
          }

          if (errType === "peer-unavailable" && state.myPeerId === PEER_ID_SECONDARY) {
            initP2P(PEER_ID_PRIMARY);
            return;
          }

          clearTimeout(state.reconnectTimer);
          state.reconnectTimer = setTimeout(() => initP2P(PEER_ID_PRIMARY), 2500);
        });
      }

      function connectToPrimaryPeer() {
        const peer = state.peer;
        if (!peer || peer.destroyed || peer.disconnected || state.isConnected) return;

        clearTimeout(state.connectTimeoutTimer);

        if (state.conn && !state.conn.open) {
          try { state.conn.close(); } catch (e) {}
        }

        const outgoingConn = peer.connect(PEER_ID_PRIMARY, {
          reliable: true,
          serialization: "json"
        });
        bindDataChannel(outgoingConn);

        state.connectTimeoutTimer = setTimeout(() => {
          if (!state.isConnected && state.myPeerId === PEER_ID_SECONDARY) {
            try { outgoingConn.close(); } catch (e) {}
            connectToPrimaryPeer();
          }
        }, 4500);
      }

      function bindDataChannel(dataConn) {
        if (!dataConn) return;

        if (state.conn && state.conn !== dataConn && state.conn.open) {
          try { state.conn.close(); } catch (e) {}
        }

        state.conn = dataConn;

        dataConn.on("open", () => {
          if (state.conn !== dataConn) return;
          clearTimeout(state.connectTimeoutTimer);
          clearTimeout(state.reconnectTimer);

          const wasDisconnected = !state.isConnected;
          state.isConnected = true;
          state.lastPongAt = Date.now();
          updateP2PIndicator();

          if (wasDisconnected) {
            appendSystemNotice(SVG_ICONS.sysLink, "Собеседник подключился");
          }

          startHeartbeat();

          if (state.currentVideoUrl) {
            sendPeerPacket({
              type: "sync-state",
              url: state.currentVideoUrl,
              title: state.currentVideoTitle,
              time: els.video.currentTime || 0,
              paused: els.video.paused
            });
          }
        });

        dataConn.on("data", (packet) => {
          if (state.conn !== dataConn) return;
          handleIncomingPacket(packet);
        });

        dataConn.on("close", () => {
          if (state.conn !== dataConn) return;
          handleConnectionLost();
        });

        dataConn.on("error", () => {
          if (state.conn !== dataConn) return;
          handleConnectionLost();
        });
      }

      function handleConnectionLost() {
        clearInterval(state.heartbeatTimer);
        clearTimeout(state.connectTimeoutTimer);

        if (state.isConnected) {
          state.isConnected = false;
          updateP2PIndicator();
          appendSystemNotice(SVG_ICONS.sysLink, "Связь прервана, переподключение...");
        } else {
          updateP2PIndicator();
        }

        if (state.myPeerId === PEER_ID_SECONDARY) {
          clearTimeout(state.reconnectTimer);
          state.reconnectTimer = setTimeout(connectToPrimaryPeer, 1500);
        }
      }

      function startHeartbeat() {
        clearInterval(state.heartbeatTimer);
        state.heartbeatTimer = setInterval(() => {
          if (!state.isConnected || !state.conn || !state.conn.open) return;

          if (Date.now() - state.lastPongAt > 12000) {
            try { state.conn.close(); } catch (e) {}
            handleConnectionLost();
            return;
          }

          sendPeerPacket({ type: "ping" });
        }, 4000);
      }

      function sendPeerPacket(payload) {
        if (state.conn && state.conn.open) {
          try {
            state.conn.send(payload);
          } catch (e) {}
        }
      }

      function lockRemoteSync(durationMs = 450) {
        state.isApplyingRemote = true;
        clearTimeout(state.remoteLockTimer);
        state.remoteLockTimer = setTimeout(() => {
          state.isApplyingRemote = false;
        }, durationMs);
      }

      function resolvePlayableUrl(incomingUrl) {
        try {
          const parsed = new URL(incomingUrl);
          const incomingOrigin = parsed.origin;
          if (PRESET_SERVERS.includes(incomingOrigin) && PRESET_SERVERS.includes(state.serverBaseUrl)) {
            return state.serverBaseUrl + parsed.pathname + parsed.search;
          }
        } catch (e) {}
        return incomingUrl;
      }

      function loadVideoSource(url, title, isLocalInitiator) {
        const effectiveUrl = isLocalInitiator ? url : resolvePlayableUrl(url);
        const cleanTitle = title || decodeURIComponent(effectiveUrl.split("/").pop() || "Видео");

        state.currentVideoUrl = effectiveUrl;
        state.currentVideoTitle = cleanTitle;

        els.videoTitleChip.textContent = cleanTitle;
        els.playerEmpty.classList.add("hidden");
        showControlsTemporarily();

        if (!isLocalInitiator) {
          lockRemoteSync(700);
        }

        els.video.src = effectiveUrl;
        els.video.load();
        updatePlayPauseUI();
        updateTimelineUI();

        appendSystemNotice(SVG_ICONS.film, `Выбрано: ${cleanTitle}`);

        if (isLocalInitiator) {
          sendPeerPacket({
            type: "load",
            url: effectiveUrl,
            title: cleanTitle
          });
        }
      }

      async function safePlayVideo() {
        try {
          await els.video.play();
          els.unmuteBadge.classList.remove("visible");
        } catch (err) {
          els.video.muted = true;
          updateMuteUI();
          els.unmuteBadge.classList.add("visible");
          try {
            await els.video.play();
          } catch (e) {}
        }
        updatePlayPauseUI();
      }

      function alignVideoTimestamp(targetTime) {
        if (!Number.isFinite(targetTime) || targetTime < 0) return;
        const current = els.video.currentTime || 0;
        if (Math.abs(current - targetTime) > DRIFT_THRESHOLD_SEC) {
          lockRemoteSync(500);
          try {
            els.video.currentTime = targetTime;
          } catch (e) {}
        }
      }

      function handleIncomingPacket(packet) {
        if (!packet || typeof packet !== "object") return;

        switch (packet.type) {
          case "ping":
            sendPeerPacket({ type: "pong" });
            break;

          case "pong":
            state.lastPongAt = Date.now();
            break;

          case "chat":
            if (typeof packet.text === "string" && packet.text.trim()) {
              appendChatMessage(packet.text.trim(), false);
            }
            break;

          case "load":
            if (packet.url) {
              loadVideoSource(packet.url, packet.title, false);
            }
            break;

          case "play":
            lockRemoteSync(500);
            alignVideoTimestamp(packet.time);
            safePlayVideo();
            appendSystemNotice(SVG_ICONS.sysPlay, `Пуск · ${formatTime(packet.time)}`);
            break;

          case "pause":
            lockRemoteSync(500);
            els.video.pause();
            alignVideoTimestamp(packet.time);
            updatePlayPauseUI();
            appendSystemNotice(SVG_ICONS.sysPause, `Пауза · ${formatTime(packet.time)}`);
            break;

          case "seek":
            lockRemoteSync(500);
            if (Number.isFinite(packet.time)) {
              els.video.currentTime = packet.time;
              updateTimelineUI();
              appendSystemNotice(SVG_ICONS.sysSeek, `Перемотка · ${formatTime(packet.time)}`);
            }
            break;

          case "time-sync":
            if (state.currentVideoUrl && els.video.readyState >= 2) {
              alignVideoTimestamp(packet.time);
              if (!packet.paused && els.video.paused) {
                lockRemoteSync(500);
                safePlayVideo();
              } else if (packet.paused && !els.video.paused) {
                lockRemoteSync(500);
                els.video.pause();
                updatePlayPauseUI();
              }
            }
            break;

          case "sync-state":
            if (packet.url && packet.url !== state.currentVideoUrl) {
              loadVideoSource(packet.url, packet.title, false);
              const onMetaReady = () => {
                lockRemoteSync(600);
                if (Number.isFinite(packet.time)) {
                  els.video.currentTime = packet.time;
                }
                if (!packet.paused) {
                  safePlayVideo();
                }
              };
              els.video.addEventListener("loadedmetadata", onMetaReady, { once: true });
            } else if (packet.url) {
              alignVideoTimestamp(packet.time);
              if (!packet.paused && els.video.paused) {
                lockRemoteSync(500);
                safePlayVideo();
              }
            }
            break;
        }
      }

      els.video.addEventListener("play", () => {
        updatePlayPauseUI();
        scheduleControlsAutoHide();
        requestScreenWakeLock();
        if (state.isApplyingRemote) return;

        const t = els.video.currentTime || 0;
        sendPeerPacket({ type: "play", time: t });
        appendSystemNotice(SVG_ICONS.sysPlay, `Пуск · ${formatTime(t)}`);
      });

      els.video.addEventListener("pause", () => {
        updatePlayPauseUI();
        showControlsTemporarily(false);
        releaseScreenWakeLock();
        if (state.isApplyingRemote || els.video.seeking) return;

        const t = els.video.currentTime || 0;
        sendPeerPacket({ type: "pause", time: t });
        appendSystemNotice(SVG_ICONS.sysPause, `Пауза · ${formatTime(t)}`);
      });

      els.video.addEventListener("seeked", () => {
        updateTimelineUI();
        if (state.isApplyingRemote) return;

        const t = els.video.currentTime || 0;
        sendPeerPacket({ type: "seek", time: t });
        appendSystemNotice(SVG_ICONS.sysSeek, `Перемотка · ${formatTime(t)}`);
      });

      els.video.addEventListener("timeupdate", () => {
        if (!state.isScrubbing) {
          updateTimelineUI();
        }
      });

      els.video.addEventListener("loadedmetadata", updateTimelineUI);

      els.video.addEventListener("error", () => {
        const err = els.video.error;
        let reason = "ошибка загрузки потока";
        if (err) {
          if (err.code === 2) reason = "ошибка сети при загрузке видео";
          else if (err.code === 3) reason = "ошибка декодирования видео";
          else if (err.code === 4) reason = "формат/кодек не поддерживается браузером или заблокирован HTTP";
        }
        appendSystemNotice(SVG_ICONS.film, `Не удалось воспроизвести: ${reason}`);
        showControlsTemporarily(false);
      });

      state.driftSyncTimer = setInterval(() => {
        if (!state.isConnected || !state.currentVideoUrl) return;
        if (els.video.paused || els.video.seeking || els.video.readyState < 2) return;

        sendPeerPacket({
          type: "time-sync",
          time: els.video.currentTime || 0,
          paused: els.video.paused
        });
      }, 2000);

      function updatePlayPauseUI() {
        els.playPauseIcon.innerHTML = els.video.paused ? SVG_ICONS.play : SVG_ICONS.pause;
      }

      function updateMuteUI() {
        els.muteIcon.innerHTML = els.video.muted ? SVG_ICONS.volumeMuted : SVG_ICONS.volumeOn;
      }

      function updateTimelineUI() {
        const duration = els.video.duration;
        const current = els.video.currentTime || 0;
        const pct = Number.isFinite(duration) && duration > 0
          ? Math.min(100, Math.max(0, (current / duration) * 100))
          : 0;

        els.scrubberFill.style.width = `${pct}%`;
        els.scrubberThumb.style.left = `${pct}%`;
        els.timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
      }

      function showControlsTemporarily(autoHide = true) {
        if (!state.currentVideoUrl) return;
        els.playerControls.classList.remove("hidden-ui");
        clearTimeout(state.controlsHideTimer);
        if (autoHide && !els.video.paused) {
          scheduleControlsAutoHide();
        }
      }

      function scheduleControlsAutoHide() {
        clearTimeout(state.controlsHideTimer);
        state.controlsHideTimer = setTimeout(() => {
          if (!els.video.paused && !state.isScrubbing) {
            els.playerControls.classList.add("hidden-ui");
          }
        }, 3000);
      }

      function triggerSeekRipple(direction) {
        const el = direction < 0 ? els.seekRippleLeft : els.seekRippleRight;
        el.classList.add("show");
        clearTimeout(el._hideTimer);
        el._hideTimer = setTimeout(() => el.classList.remove("show"), 550);
      }

      /* Обработка одиночного тапа (показ/скрытие UI) и двойного тапа (перемотка ±10 сек) */
      els.playerWrapper.addEventListener("click", (e) => {
        if (!state.currentVideoUrl) return;
        if (e.target.closest("button") || e.target.closest("#scrubberWrap")) return;

        const now = Date.now();
        const timeSinceLastTap = now - state.lastTapTime;
        state.lastTapTime = now;

        if (timeSinceLastTap < 270) {
          clearTimeout(state.singleTapTimer);
          const rect = els.playerWrapper.getBoundingClientRect();
          const tapX = e.clientX - rect.left;
          if (tapX < rect.width * 0.42) {
            els.video.currentTime = Math.max(0, (els.video.currentTime || 0) - 10);
            triggerSeekRipple(-1);
          } else if (tapX > rect.width * 0.58) {
            const maxT = Number.isFinite(els.video.duration) ? els.video.duration : Infinity;
            els.video.currentTime = Math.min(maxT, (els.video.currentTime || 0) + 10);
            triggerSeekRipple(1);
          }
          return;
        }

        clearTimeout(state.singleTapTimer);
        state.singleTapTimer = setTimeout(() => {
          if (els.playerControls.classList.contains("hidden-ui")) {
            showControlsTemporarily(true);
          } else {
            els.playerControls.classList.add("hidden-ui");
          }
        }, 230);
      });

      /* Показ контролов при движении мыши на ПК */
      els.playerWrapper.addEventListener("mousemove", () => {
        if (!isMobileDevice && state.currentVideoUrl) {
          showControlsTemporarily(true);
        }
      });

      els.playPauseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!state.currentVideoUrl) return;
        if (els.video.paused) {
          safePlayVideo();
        } else {
          els.video.pause();
        }
      });

      els.seekBackBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!state.currentVideoUrl) return;
        els.video.currentTime = Math.max(0, (els.video.currentTime || 0) - 10);
        showControlsTemporarily(true);
      });

      els.seekFwdBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!state.currentVideoUrl) return;
        const maxT = Number.isFinite(els.video.duration) ? els.video.duration : Infinity;
        els.video.currentTime = Math.min(maxT, (els.video.currentTime || 0) + 10);
        showControlsTemporarily(true);
      });

      els.muteToggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        els.video.muted = !els.video.muted;
        if (!els.video.muted) {
          els.unmuteBadge.classList.remove("visible");
        }
        updateMuteUI();
        showControlsTemporarily(true);
      });

      els.unmuteBadge.addEventListener("click", (e) => {
        e.stopPropagation();
        els.video.muted = false;
        els.unmuteBadge.classList.remove("visible");
        updateMuteUI();
      });

      /* Переключение масштаба кадра в полноэкранном режиме (Fit / Fill) */
      els.aspectToggleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        state.isVideoCropped = !state.isVideoCropped;
        els.video.classList.toggle("fill-crop", state.isVideoCropped);
        els.aspectToggleBtn.classList.toggle("active-mode", state.isVideoCropped);
        els.aspectLabel.textContent = state.isVideoCropped ? "Весь экран" : "16:9";
        showControlsTemporarily(true);
      });

      /* Блокировка засыпания дисплея во время просмотра в APK / браузере */
      async function requestScreenWakeLock() {
        if (!("wakeLock" in navigator) || state.wakeLockSentinel) return;
        try {
          state.wakeLockSentinel = await navigator.wakeLock.request("screen");
          state.wakeLockSentinel.addEventListener("release", () => {
            state.wakeLockSentinel = null;
          });
        } catch (e) {}
      }

      function releaseScreenWakeLock() {
        if (state.wakeLockSentinel) {
          try { state.wakeLockSentinel.release(); } catch (e) {}
          state.wakeLockSentinel = null;
        }
      }

      /* Управление системным StatusBar в Capacitor APK */
      async function setCapacitorImmersive(immersive) {
        const cap = window.Capacitor;
        if (!cap || !cap.Plugins) return;

        try {
          if (cap.Plugins.StatusBar) {
            if (immersive) {
              await cap.Plugins.StatusBar.setOverlaysWebView({ overlay: true });
              await cap.Plugins.StatusBar.hide();
            } else {
              await cap.Plugins.StatusBar.show();
              await cap.Plugins.StatusBar.setBackgroundColor({ color: "#181825" });
            }
          }
        } catch (e) {}
      }

      /* Полноэкранный режим для Capacitor Android APK, мобильных браузеров и ПК */
      function isAnyFullscreenActive() {
        return Boolean(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          state.isPseudoFullscreen
        );
      }

      function syncFullscreenUI() {
        const active = isAnyFullscreenActive();
        document.documentElement.classList.toggle("fs-active", active);
        els.playerWrapper.classList.toggle("is-fullscreen", active);
        els.fullscreenIcon.innerHTML = active ? SVG_ICONS.fsExit : SVG_ICONS.fsEnter;

        if (!active && state.isVideoCropped) {
          state.isVideoCropped = false;
          els.video.classList.remove("fill-crop");
          els.aspectToggleBtn.classList.remove("active-mode");
          els.aspectLabel.textContent = "16:9";
        }

        if (els.themeColorMeta) {
          els.themeColorMeta.setAttribute("content", active ? "#000000" : "#181825");
        }
        setCapacitorImmersive(active);
      }

      async function enterMobileFullscreen() {
        const wrapper = els.playerWrapper;
        /* В Android WebView (Capacitor) и на ПК requestFullscreen на playerWrapper
           активирует нативный onShowCustomView — скрывает шторку, навигацию и серую зону выреза камеры */
        const requestFn = wrapper.requestFullscreen || wrapper.webkitRequestFullscreen;

        if (requestFn) {
          try {
            await requestFn.call(wrapper, { navigationUI: "hide" });
          } catch (err) {
            try {
              await requestFn.call(wrapper);
            } catch (e) {
              state.isPseudoFullscreen = true;
            }
          }
        } else if (typeof els.video.webkitEnterFullscreen === "function" && els.video.readyState >= 1) {
          try {
            els.video.webkitEnterFullscreen();
            return;
          } catch (e) {
            state.isPseudoFullscreen = true;
          }
        } else {
          state.isPseudoFullscreen = true;
        }

        syncFullscreenUI();

        if (isMobileDevice && screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(() => {});
        }
      }

      async function exitMobileFullscreen() {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          const exitFn = document.exitFullscreen || document.webkitExitFullscreen;
          if (exitFn) {
            try {
              await exitFn.call(document);
            } catch (e) {}
          }
        }
        state.isPseudoFullscreen = false;
        syncFullscreenUI();

        if (isMobileDevice && screen.orientation && screen.orientation.unlock) {
          try {
            screen.orientation.unlock();
          } catch (e) {}
        }
      }

      els.fullscreenBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!isAnyFullscreenActive()) {
          enterMobileFullscreen();
        } else {
          exitMobileFullscreen();
        }
        showControlsTemporarily(true);
      });

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          state.isPseudoFullscreen = false;
          if (screen.orientation && screen.orientation.unlock) {
            try { screen.orientation.unlock(); } catch (e) {}
          }
        }
        syncFullscreenUI();
      });

      document.addEventListener("webkitfullscreenchange", () => {
        if (!document.webkitFullscreenElement) {
          state.isPseudoFullscreen = false;
        }
        syncFullscreenUI();
      });

      /* Поддержка аппаратной кнопки «Назад» в Capacitor Android APK */
      document.addEventListener("backbutton", (e) => {
        if (els.libraryModal.classList.contains("open")) {
          e.preventDefault();
          closeLibraryModal();
        } else if (isAnyFullscreenActive()) {
          e.preventDefault();
          exitMobileFullscreen();
        }
      });

      /* Горячие клавиши для управления видео на ПК */
      document.addEventListener("keydown", (e) => {
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || els.libraryModal.classList.contains("open")) return;
        if (!state.currentVideoUrl) return;

        if (e.code === "Space") {
          e.preventDefault();
          if (els.video.paused) safePlayVideo();
          else els.video.pause();
          showControlsTemporarily(true);
        } else if (e.code === "ArrowLeft") {
          e.preventDefault();
          els.video.currentTime = Math.max(0, (els.video.currentTime || 0) - 10);
          triggerSeekRipple(-1);
          showControlsTemporarily(true);
        } else if (e.code === "ArrowRight") {
          e.preventDefault();
          const maxT = Number.isFinite(els.video.duration) ? els.video.duration : Infinity;
          els.video.currentTime = Math.min(maxT, (els.video.currentTime || 0) + 10);
          triggerSeekRipple(1);
          showControlsTemporarily(true);
        } else if (e.code === "KeyF") {
          e.preventDefault();
          if (!isAnyFullscreenActive()) enterMobileFullscreen();
          else exitMobileFullscreen();
        } else if (e.code === "KeyM") {
          e.preventDefault();
          els.video.muted = !els.video.muted;
          if (!els.video.muted) els.unmuteBadge.classList.remove("visible");
          updateMuteUI();
          showControlsTemporarily(true);
        }
      });

      function scrubToClientX(clientX) {
        const rect = els.scrubberWrap.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        els.scrubberFill.style.width = `${ratio * 100}%`;
        els.scrubberThumb.style.left = `${ratio * 100}%`;

        if (Number.isFinite(els.video.duration) && els.video.duration > 0) {
          const target = ratio * els.video.duration;
          els.timeDisplay.textContent = `${formatTime(target)} / ${formatTime(els.video.duration)}`;
          return target;
        }
        return null;
      }

      els.scrubberWrap.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        if (!Number.isFinite(els.video.duration) || els.video.duration <= 0) return;
        state.isScrubbing = true;
        els.scrubberWrap.classList.add("scrubbing");
        els.scrubberWrap.setPointerCapture(e.pointerId);
        scrubToClientX(e.clientX);
        showControlsTemporarily(false);
      });

      els.scrubberWrap.addEventListener("pointermove", (e) => {
        if (!state.isScrubbing) return;
        scrubToClientX(e.clientX);
      });

      els.scrubberWrap.addEventListener("pointerup", (e) => {
        if (!state.isScrubbing) return;
        state.isScrubbing = false;
        els.scrubberWrap.classList.remove("scrubbing");
        const target = scrubToClientX(e.clientX);
        if (target !== null) {
          els.video.currentTime = target;
        }
        scheduleControlsAutoHide();
      });

      function syncServerControlsUI() {
        els.serverUrlInput.value = state.serverBaseUrl;
        els.presetWanBtn.classList.toggle("active", state.serverBaseUrl === PRESET_SERVERS[0]);
        els.presetLanBtn.classList.toggle("active", state.serverBaseUrl === PRESET_SERVERS[1]);
      }

      function openLibraryModal() {
        syncServerControlsUI();
        els.libraryModal.classList.add("open");
        const startUrl = state.currentBrowseUrl || `${state.serverBaseUrl}/`;
        fetchDirectoryListing(startUrl);
      }

      function closeLibraryModal() {
        els.libraryModal.classList.remove("open");
      }

      function updateDirNavigationUI(url) {
        try {
          const parsed = new URL(url);
          const path = decodeURIComponent(parsed.pathname || "/");
          els.dirPathLabel.textContent = path;
          els.dirNavBar.classList.toggle("visible", state.dirHistory.length > 0 || path !== "/");
        } catch (e) {
          els.dirNavBar.classList.remove("visible");
        }
      }

      async function fetchDirectoryListing(targetUrl) {
        if (isVideoFileName(targetUrl)) {
          const fileName = decodeURIComponent(targetUrl.split("/").pop().split("?")[0]);
          closeLibraryModal();
          loadVideoSource(targetUrl, fileName, true);
          return;
        }

        const dirUrl = targetUrl.endsWith("/") ? targetUrl : `${targetUrl}/`;
        state.currentBrowseUrl = dirUrl;
        updateDirNavigationUI(dirUrl);

        els.mediaList.innerHTML = `
          <div class="media-state-box">
            <svg class="spin" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#cba6f7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
            </svg>
            <span>Загрузка списка...</span>
          </div>
        `;

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 8000);
          const response = await fetch(dirUrl, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const html = await response.text();
          const entries = parseDirectoryHtml(html, dirUrl);
          renderMediaEntries(entries);
        } catch (err) {
          els.mediaList.innerHTML = `
            <div class="media-state-box">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f38ba8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span>Сервер недоступен (${err.message || "ошибка сети"})</span>
            </div>
          `;
        }
      }

      function parseDirectoryHtml(htmlString, baseDirUrl) {
        const doc = new DOMParser().parseFromString(htmlString, "text/html");
        const anchors = Array.from(doc.querySelectorAll("a[href]"));
        const baseObj = new URL(baseDirUrl);
        const seen = new Set();
        const dirs = [];
        const videos = [];

        for (const a of anchors) {
          const rawHref = (a.getAttribute("href") || "").trim();
          if (
            !rawHref ||
            rawHref.startsWith("#") ||
            rawHref.startsWith("?") ||
            rawHref.startsWith("mailto:") ||
            rawHref.startsWith("javascript:") ||
            rawHref === "../" ||
            rawHref === "./" ||
            rawHref === ".."
          ) {
            continue;
          }

          let resolved;
          try {
            resolved = new URL(rawHref, baseObj);
          } catch (e) {
            continue;
          }

          if (
            resolved.origin === baseObj.origin &&
            resolved.pathname.length < baseObj.pathname.length &&
            baseObj.pathname.startsWith(resolved.pathname)
          ) {
            continue;
          }

          const fullHref = resolved.href;
          if (seen.has(fullHref)) continue;
          seen.add(fullHref);

          const pathSegments = resolved.pathname.split("/").filter(Boolean);
          const rawLastSegment = pathSegments[pathSegments.length - 1] || "";
          let displayName = rawLastSegment;
          try {
            displayName = decodeURIComponent(rawLastSegment);
          } catch (e) {
            displayName = rawLastSegment;
          }

          if (resolved.pathname.endsWith("/")) {
            if (!displayName) continue;
            dirs.push({
              type: "dir",
              url: fullHref,
              name: displayName
            });
          } else if (isVideoFileName(resolved.pathname)) {
            videos.push({
              type: "video",
              url: fullHref,
              name: displayName || a.textContent.trim(),
              ext: getExtensionLabel(resolved.pathname)
            });
          }
        }

        const sorter = (x, y) => x.name.localeCompare(y.name, undefined, { numeric: true, sensitivity: "base" });
        dirs.sort(sorter);
        videos.sort(sorter);

        return [...dirs, ...videos];
      }

      function renderMediaEntries(entries) {
        if (!entries.length) {
          els.mediaList.innerHTML = `
            <div class="media-state-box">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6c7086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>Видеофайлы не найдены</span>
            </div>
          `;
          return;
        }

        els.mediaList.innerHTML = "";

        for (const item of entries) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `media-item ${item.type === "dir" ? "is-dir" : ""}`;

          if (item.type === "video" && state.currentVideoUrl === item.url) {
            btn.classList.add("active-video");
          }

          const iconWrap = document.createElement("div");
          iconWrap.className = "media-item-icon";
          iconWrap.innerHTML = item.type === "dir" ? SVG_ICONS.folder : SVG_ICONS.fileVideo;

          const nameSpan = document.createElement("span");
          nameSpan.className = "media-item-name";
          nameSpan.textContent = item.name;

          btn.appendChild(iconWrap);
          btn.appendChild(nameSpan);

          if (item.type === "video") {
            const extBadge = document.createElement("span");
            extBadge.className = "media-ext-tag";
            extBadge.textContent = item.ext;
            btn.appendChild(extBadge);

            btn.addEventListener("click", () => {
              closeLibraryModal();
              loadVideoSource(item.url, item.name, true);
            });
          } else {
            btn.addEventListener("click", () => {
              state.dirHistory.push(state.currentBrowseUrl);
              fetchDirectoryListing(item.url);
            });
          }

          els.mediaList.appendChild(btn);
        }
      }

      els.chatForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = els.chatInput.value.trim();
        if (!text) return;

        els.chatInput.value = "";
        appendChatMessage(text, true);
        sendPeerPacket({ type: "chat", text });
      });

      els.p2pStatusPill.addEventListener("click", () => {
        initP2P(PEER_ID_PRIMARY);
      });

      els.openLibraryBtn.addEventListener("click", openLibraryModal);
      els.playerEmpty.addEventListener("click", openLibraryModal);
      els.closeLibraryBtn.addEventListener("click", closeLibraryModal);

      els.libraryModal.addEventListener("click", (e) => {
        if (e.target === els.libraryModal) {
          closeLibraryModal();
        }
      });

      els.refreshLibraryBtn.addEventListener("click", () => {
        fetchDirectoryListing(state.currentBrowseUrl || `${state.serverBaseUrl}/`);
      });

      [els.presetWanBtn, els.presetLanBtn].forEach((btn) => {
        btn.addEventListener("click", () => {
          const url = normalizeServerUrl(btn.getAttribute("data-server"));
          state.serverBaseUrl = url;
          state.dirHistory = [];
          saveServerUrl(url);
          syncServerControlsUI();
          fetchDirectoryListing(`${url}/`);
        });
      });

      els.saveServerUrlBtn.addEventListener("click", () => {
        const raw = els.serverUrlInput.value.trim();
        if (!raw) return;

        if (isVideoFileName(raw)) {
          const fullUrl = /^https?:\/\//i.test(raw) ? raw : `http://${raw}`;
          closeLibraryModal();
          loadVideoSource(fullUrl, "", true);
          return;
        }

        const normalized = normalizeServerUrl(raw);
        state.serverBaseUrl = normalized;
        state.dirHistory = [];
        saveServerUrl(normalized);
        syncServerControlsUI();
        fetchDirectoryListing(`${normalized}/`);
      });

      els.serverUrlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          els.saveServerUrlBtn.click();
        }
      });

      els.dirUpBtn.addEventListener("click", () => {
        if (state.dirHistory.length > 0) {
          const prevUrl = state.dirHistory.pop();
          fetchDirectoryListing(prevUrl);
        } else {
          fetchDirectoryListing(`${state.serverBaseUrl}/`);
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          if (!els.video.paused) {
            requestScreenWakeLock();
          }
          if (!state.isConnected) {
            if (!state.peer || state.peer.destroyed) {
              initP2P(PEER_ID_PRIMARY);
            } else if (state.peer.disconnected) {
              try { state.peer.reconnect(); } catch (e) { initP2P(PEER_ID_PRIMARY); }
            } else if (state.myPeerId === PEER_ID_SECONDARY) {
              connectToPrimaryPeer();
            }
          }
        }
      });

      setCapacitorImmersive(false);
      syncServerControlsUI();
      initP2P(PEER_ID_PRIMARY);
    })();
  </script>
</body>
</html>
