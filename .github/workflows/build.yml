name: Build Lukin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Prepare web & icon assets
        run: |
          mkdir -p www assets
          cp lukin.html www/index.html
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon.png

      - name: Initialize Capacitor & Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "ru.darnitsyn.lukin",
            "appName": "Lukin",
            "webDir": "www",
            "server": {
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#181825'
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lukin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
